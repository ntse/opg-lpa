[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opg-lpa-service-api"
version = "0.1.0"
description = "FastAPI rewrite of the OPG LPA service API"
authors = [{name = "OPG"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "bcrypt>=4.1",
    "python-dateutil>=2.9",
    "boto3>=1.34",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
