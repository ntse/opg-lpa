[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opg-lpa-service-front"
version = "0.1.0"
description = "FastAPI rewrite of the OPG LPA service front-end"
authors = [{name = "OPG"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.4",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
